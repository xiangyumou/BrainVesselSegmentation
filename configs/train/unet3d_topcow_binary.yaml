schema_version: 1
experiment_name: unet3d_topcow_binary
stage: supervised
seed: 42
device: auto
output_root: runs
model:
  name: standard_unet3d
  in_channels: 1
  num_classes: 2
  base_channels: 32
data:
  adapter: topcow
  root: null
  train_root: null
  val_root: null
  test_root: null
  split_file: configs/splits/topcow_binary_seed42.json
  modalities: {}
  label: {}
  crop_or_pad_size: [331, 432, 100]
  patch_size: [48, 48, 48]
  patch_overlap: [24, 24, 24]
  normalization: torchio_zscore
  sampler: uniform
  samples_per_volume: 4
  queue_length: 30
  validation_samples_per_volume: 1
  positive_probability: 0.7
  num_workers: 0
  augmentation:
    enabled: false
training:
  epochs: 200
  batch_size: 1
  learning_rate: 0.001
  weight_decay: 0.00001
  optimizer: adam
  scheduler:
    name: step_lr
    step_size: 10
    gamma: 0.8
  early_stopping_patience: 20
  gradient_accumulation: 4
  gradient_clip_norm: null
  logits_clip: null
  amp: auto
  resume_checkpoint: null
loss:
  segmentation:
    cross_entropy_weight: 1.0
    dice_weight: 1.0
    dice_variant: foreground
  logit_distillation:
    enabled: false
    temperature: 10.0
    weight: 0.5
  feature_distillation:
    enabled: false
    weight: 0.5
    margin: 1.0
    projection_dim: 8
inference:
  branch: student
  window_size: [48, 48, 48]
  overlap: [24, 24, 24]
  compatibility_mode: gaussian
