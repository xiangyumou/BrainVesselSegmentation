schema_version: 1
experiment_name: lingfeng_student_transfer_topcow_binary
stage: supervised
seed: 42
device: auto
output_root: runs
model:
  name: lingfeng_student_transfer
  modalities: [mra]
  student_modality: mra
  in_channels: {mra: 1}
  num_classes: 2
  base_channels: 16
  pretrained_checkpoint: artifacts/checkpoints/lingfeng-student_best_checkpoint_multimodaltune9.pt
  freeze_encoder: false
data:
  adapter: pattern_directory
  root: /home/user/xiangyu/st/LFModel/raw/Dataset001_BrainVesselSegmentation
  train_root: null
  val_root: null
  split_file: configs/splits/topcow2024_release_seed42.json
  modalities:
    mra:
      directory: imagesTr
      pattern: topcow_mr_{case_id}_0000.nii.gz
  label:
    directory: cow_seg_labelsTr
    pattern: topcow_mr_{case_id}.nii.gz
    strategy: nonzero_to_foreground
  crop_or_pad_size: null
  patch_size: [48, 48, 48]
  normalization: nonzero_zscore
  samples_per_volume: 4
  validation_samples_per_volume: 1
  positive_probability: 0.7
  cache_max_cases: 2
  num_workers: 0
  augmentation:
    enabled: false
training:
  epochs: 20
  batch_size: 1
  learning_rate: 0.001
  weight_decay: 0.00001
  optimizer: adam
  scheduler:
    name: step_lr
    step_size: 10
    gamma: 0.8
  early_stopping_patience: null
  gradient_accumulation: 4
  gradient_clip_norm: null
  logits_clip: null
  amp: auto
  resume_checkpoint: null
loss:
  segmentation:
    cross_entropy_weight: 1.0
    dice_weight: 1.0
    dice_variant: foreground
  logit_distillation:
    enabled: false
    temperature: 10.0
    weight: 0.5
  feature_distillation:
    enabled: false
    weight: 0.5
    margin: 1.0
    projection_dim: 8
inference:
  branch: student
  window_size: [48, 48, 48]
  overlap: [24, 24, 24]
  compatibility_mode: gaussian
